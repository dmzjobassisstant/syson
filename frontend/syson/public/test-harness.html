<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SysON Model Element Test Harness</title>
<style>
:root {
  --bg:#fff; --text:#1a1a2e; --border:#e2e8f0; --accent:#2563eb; --accent-hover:#1d4ed8;
  --code-bg:#f8fafc; --success:#059669; --error:#dc2626; --muted:#64748b; --hover:#f1f5f9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px}
.container{max-width:1400px;margin:0 auto;padding:16px}
.header{border-bottom:1px solid var(--border);padding-bottom:10px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:18px;font-weight:600}
.status{font-size:11px;padding:3px 8px;border-radius:4px}
.status.on{background:#dcfce7;color:var(--success)}
.status.off{background:#fef2f2;color:var(--error)}
.grid{display:grid;grid-template-columns:280px 380px 1fr;gap:14px}
@media(max-width:1100px){.grid{grid-template-columns:1fr}}
.card{border:1px solid var(--border);border-radius:8px;padding:14px}
.card h2{font-size:12px;font-weight:600;margin-bottom:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.form-group{margin-bottom:8px}
.form-group label{display:block;font-size:11px;font-weight:500;margin-bottom:2px;color:var(--muted)}
.form-group input,.form-group select{width:100%;padding:6px 8px;border:1px solid var(--border);border-radius:5px;font-size:13px;font-family:inherit}
.form-group input:focus,.form-group select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(37,99,235,.1)}
.btn{padding:5px 12px;border:none;border-radius:5px;font-size:12px;font-weight:500;cursor:pointer}
.btn-primary{background:var(--accent);color:#fff}.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{background:#f1f5f9;color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:#e2e8f0}
.btn-execute{background:var(--success);color:#fff;font-family:monospace}.btn-execute:hover{background:#047857}
.btn-danger{background:var(--error);color:#fff}.btn-danger:hover{background:#b91c1c}
.btn-group{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
textarea.code-editor{width:100%;min-height:160px;background:var(--code-bg);border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'SF Mono','Fira Code',monospace;font-size:11px;resize:vertical;line-height:1.4}
.response{margin-top:8px;padding:8px;border-radius:6px;font-size:11px;font-family:'SF Mono','Fira Code',monospace;white-space:pre-wrap;max-height:350px;overflow-y:auto}
.response.success{background:#f0fdf4;border:1px solid #bbf7d0}
.response.error{background:#fef2f2;border:1px solid #fecaca}
.response.info{background:#eff6ff;border:1px solid #bfdbfe}
.info{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:1px;margin-bottom:8px}
.tab{padding:4px 10px;font-size:11px;cursor:pointer;border:none;background:none;border-bottom:2px solid transparent;color:var(--muted)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
.tree-container{max-height:500px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;font-size:12px}
.tree-node{padding:3px 6px;cursor:pointer;display:flex;align-items:center;gap:4px;border-radius:4px;margin:1px 0}
.tree-node:hover{background:var(--hover)}
.tree-node.selected{background:#dbeafe;border-left:3px solid var(--accent)}
.tree-node .chevron{width:14px;text-align:center;font-size:10px;color:var(--muted);flex-shrink:0}
.tree-node .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree-node .kind{font-size:10px;color:var(--muted);background:#f1f5f9;padding:1px 4px;border-radius:3px}
.tree-children{margin-left:16px}
.tree-empty{padding:12px;text-align:center;color:var(--muted);font-size:12px}
.tree-loading{padding:12px;text-align:center;color:var(--accent);font-size:12px}
</style>
</head>
<body>
<div class="container">
<div class="header">
  <h1>SysON Model Element Test Harness</h1>
  <span id="connStatus" class="status off">Disconnected</span>
</div>
<div class="grid">
  <!-- Left: Connection + Project + Document -->
  <div>
    <div class="card" style="margin-bottom:12px">
      <h2>Connection</h2>
      <div class="form-group"><label>URL</label><input id="baseUrl" value="https://syson.damuza-consulting.com"></div>
      <div class="form-group"><label>Email</label><input id="email" value="admin"></div>
      <div class="form-group"><label>Password</label><input id="password" type="password" value="admin"></div>
      <button class="btn btn-primary" style="width:100%" onclick="connect()">Connect</button>
      <div class="info" id="connInfo" style="margin-top:4px"></div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <h2>Project</h2>
      <div class="form-group"><select id="projectSelect" onchange="onProjectSelect()"><option>Connect first</option></select></div>
    </div>
    <div class="card">
      <h2>Document</h2>
      <div class="form-group"><select id="docSelect" onchange="onDocSelect()"><option>None</option></select></div>
      <div class="btn-group">
        <button class="btn btn-secondary" onclick="createDocument()">+ New Doc</button>
        <button class="btn btn-secondary" onclick="loadTree()">Refresh Tree</button>
      </div>
    </div>
  </div>

  <!-- Middle: Model Tree -->
  <div>
    <div class="card" style="height:fit-content">
      <h2>Model Tree <span id="treeCount" style="float:right;font-weight:400"></span></h2>
      <div id="treeContainer" class="tree-container">
        <div class="tree-empty">Connect and select a project to load the tree</div>
      </div>
      <div class="btn-group" id="elementActions" style="display:none">
        <button class="btn btn-secondary" onclick="populateCreateRootFromSelected()">Use as Doc</button>
        <button class="btn btn-danger" onclick="deleteSelected()">Delete</button>
      </div>
    </div>
  </div>

  <!-- Right: Mutations -->
  <div>
    <div class="card" style="margin-bottom:12px">
      <h2>Create Element</h2>
      <div class="form-group">
        <label>SysML Element Type (84 types)</label>
        <select id="rootType" onchange="updateRootMutation()"></select>
      </div>
      <div class="btn-group">
        <button class="btn btn-execute" onclick="executeRootCreate()">Create Root Object</button>
        <button class="btn btn-secondary" onclick="renameSelected()">Rename Selected</button>
      </div>
    </div>
    <div class="card" style="margin-bottom:12px">
      <h2>GraphQL Mutation</h2>
      <div class="tabs">
        <button class="tab active" onclick="setTab('createRootObject')">createRootObject</button>
        <button class="tab" onclick="setTab('createChild')">createChild</button>
        <button class="tab" onclick="setTab('createDocument')">createDocument</button>
        <button class="tab" onclick="setTab('renameTreeItem')">renameTreeItem</button>
        <button class="tab" onclick="setTab('raw')">Raw</button>
      </div>
      <textarea id="mutationEditor" class="code-editor" spellcheck="false"></textarea>
      <div class="btn-group">
        <button class="btn btn-execute" onclick="executeMutation()">Execute</button>
        <button class="btn btn-secondary" onclick="copyMutation()">Copy</button>
      </div>
      <div id="response"></div>
    </div>
    <div class="card" style="margin-top:12px">
      <h2>Example: Connected Parts</h2>
      <p style="font-size:11px;color:var(--muted);margin-bottom:6px">Creates a Package + 2 PartUsages + FlowConnectionUsage linking them</p>
      <button class="btn btn-execute" onclick="createConnectedPartsExample()" style="width:100%">Create Connected Parts Example</button>
    </div>
  </div>
</div>
</div>
<script>
const ROOT_TYPES=[["SysMLv2EditService-Package","Package"],["SysMLv2EditService-PartDefinition","Part Definition"],["SysMLv2EditService-PartUsage","Part"],["SysMLv2EditService-RequirementDefinition","Requirement Definition"],["SysMLv2EditService-RequirementUsage","Requirement"],["SysMLv2EditService-InterfaceDefinition","Interface Definition"],["SysMLv2EditService-InterfaceUsage","Interface"],["SysMLv2EditService-PortDefinition","Port Definition"],["SysMLv2EditService-PortUsage","Port"],["SysMLv2EditService-AttributeDefinition","Attribute Definition"],["SysMLv2EditService-AttributeUsage","Attribute"],["SysMLv2EditService-ItemDefinition","Item Definition"],["SysMLv2EditService-ItemUsage","Item"],["SysMLv2EditService-ActionDefinition","Action Definition"],["SysMLv2EditService-ActionUsage","Action"],["SysMLv2EditService-StateDefinition","State Definition"],["SysMLv2EditService-StateUsage","State"],["SysMLv2EditService-ConstraintDefinition","Constraint Definition"],["SysMLv2EditService-ConstraintUsage","Constraint"],["SysMLv2EditService-ConnectionDefinition","Connection Definition"],["SysMLv2EditService-ConnectionUsage","Connection"],["SysMLv2EditService-AllocationDefinition","Allocation Definition"],["SysMLv2EditService-AllocationUsage","Allocation"],["SysMLv2EditService-CaseDefinition","Case Definition"],["SysMLv2EditService-CaseUsage","Case"],["SysMLv2EditService-UseCaseDefinition","Use Case Definition"],["SysMLv2EditService-UseCaseUsage","Use Case"],["SysMLv2EditService-FlowConnectionDefinition","Flow Connection Definition"],["SysMLv2EditService-FlowConnectionUsage","Flow Connection"],["SysMLv2EditService-MetadataDefinition","Metadata Definition"],["SysMLv2EditService-MetadataUsage","Metadata"],["SysMLv2EditService-OccurrenceDefinition","Occurrence Definition"],["SysMLv2EditService-OccurrenceUsage","Occurrence"],["SysMLv2EditService-CalculationDefinition","Calculation Definition"],["SysMLv2EditService-CalculationUsage","Calculation"],["SysMLv2EditService-ConcernDefinition","Concern Definition"],["SysMLv2EditService-ConcernUsage","Concern"],["SysMLv2EditService-EnumerationDefinition","Enumeration Definition"],["SysMLv2EditService-EnumerationUsage","Enumeration"],["SysMLv2EditService-RenderingDefinition","Rendering Definition"],["SysMLv2EditService-RenderingUsage","Rendering"],["SysMLv2EditService-ViewDefinition","View Definition"],["SysMLv2EditService-ViewUsage","View"],["SysMLv2EditService-ViewpointDefinition","Viewpoint Definition"],["SysMLv2EditService-ViewpointUsage","Viewpoint"],["SysMLv2EditService-VerificationCaseDefinition","Verification Case Definition"],["SysMLv2EditService-VerificationCaseUsage","Verification Case"],["SysMLv2EditService-AnalysisCaseDefinition","Analysis Case Definition"],["SysMLv2EditService-AnalysisCaseUsage","Analysis Case"],["SysMLv2EditService-Comment","Comment"],["SysMLv2EditService-Dependency","Dependency"],["SysMLv2EditService-Documentation","Documentation"],["SysMLv2EditService-Definition","Definition"],["SysMLv2EditService-Usage","Usage"],["SysMLv2EditService-LibraryPackage","Library Package"],["SysMLv2EditService-AcceptActionUsage","Accept Action"],["SysMLv2EditService-AssertConstraintUsage","Assert Constraint"],["SysMLv2EditService-AssignmentActionUsage","Assignment Action"],["SysMLv2EditService-BindingConnectorAsUsage","Binding Connector As Usage"],["SysMLv2EditService-ConjugatedPortDefinition","Conjugated Port Definition"],["SysMLv2EditService-DecisionNode","Decision Node"],["SysMLv2EditService-EventOccurrenceUsage","Event Occurrence"],["SysMLv2EditService-ExhibitStateUsage","Exhibit State"],["SysMLv2EditService-ForLoopActionUsage","For Loop Action"],["SysMLv2EditService-ForkNode","Fork Node"],["SysMLv2EditService-IfActionUsage","If Action"],["SysMLv2EditService-IncludeUseCaseUsage","Include Use Case"],["SysMLv2EditService-JoinNode","Join Node"],["SysMLv2EditService-MergeNode","Merge Node"],["SysMLv2EditService-PerformActionUsage","Perform Action"],["SysMLv2EditService-ReferenceUsage","Reference"],["SysMLv2EditService-SatisfyRequirementUsage","Satisfy Requirement"],["SysMLv2EditService-SendActionUsage","Send Action"],["SysMLv2EditService-SuccessionAsUsage","Succession As Usage"],["SysMLv2EditService-SuccessionFlowConnectionUsage","Succession Flow Connection"],["SysMLv2EditService-TerminateActionUsage","Terminate Action"],["SysMLv2EditService-TextualRepresentation","Textual Representation"],["SysMLv2EditService-TransitionUsage","Transition"],["SysMLv2EditService-WhileLoopActionUsage","While Loop Action"],["SysMLv2EditService-MembershipExpose","Membership Expose"],["SysMLv2EditService-MembershipImport","Membership Import"],["SysMLv2EditService-NamespaceExpose","Namespace Expose"],["SysMLv2EditService-NamespaceImport","Namespace Import"],["SysMLv2EditService-OwningMembership","Owning Membership"]];

let state={token:null,baseUrl:'',projects:[],editingContextId:null,docs:[],currentTab:'createRootObject',domain:'http://www.eclipse.org/syson/sysml',selectedElement:null,treeData:[],expandedNodes:new Set(),explorerDescId:null,createdElements:[]};

function init(){const sel=document.getElementById('rootType');ROOT_TYPES.forEach(([id,label])=>{sel.innerHTML+=`<option value="${id}">${label}</option>`});updateRootMutation()}
init();

async function api(path,opts={}){const h={'Content-Type':'application/json',...opts.headers};if(state.token)h['Authorization']=`Bearer ${state.token}`;const r=await fetch(state.baseUrl+path,{...opts,headers:h});const t=await r.text();try{return JSON.parse(t)}catch{return t}}
async function gql(query){return api('/api/graphql',{method:'POST',body:JSON.stringify({query})})}
function showResponse(data){const d=document.getElementById('response');const err=data.errors||(typeof data==='object'&&data.error);d.innerHTML=`<div class="response ${err?'error':'success'}">${JSON.stringify(data,null,2)}</div>`}
function uuid(){return crypto.randomUUID()}

async function connect(){
  state.baseUrl=document.getElementById('baseUrl').value.trim().replace(/\/$/,'');
  const email=document.getElementById('email').value.trim();const pw=document.getElementById('password').value.trim();
  document.getElementById('connStatus').textContent='Connecting...';
  try{
    const r=await api('/api/auth/login',{method:'POST',body:JSON.stringify({email,password:pw})});
    if(!r.token)throw new Error(r.error||'Login failed');
    state.token=r.token;
    document.getElementById('connStatus').textContent='Connected';document.getElementById('connStatus').className='status on';
    await loadProjects();
  }catch(e){document.getElementById('connStatus').textContent='Error';document.getElementById('connStatus').className='status off';document.getElementById('connInfo').textContent=e.message}
}

async function loadProjects(){
  try{
    const r=await gql(`query{viewer{projects{edges{node{id name}}}}}`);
    state.projects=(r?.data?.viewer?.projects?.edges||[]).map(e=>e.node);
    const sel=document.getElementById('projectSelect');
    sel.innerHTML='<option value="">-- Select --</option>';
    state.projects.forEach(p=>{sel.innerHTML+=`<option value="${p.id}">${p.name} (${p.id.slice(0,8)}...)</option>`});
    document.getElementById('connInfo').textContent=`${state.projects.length} projects`;
  }catch(e){document.getElementById('connInfo').textContent='Error: '+e.message}
}

async function onProjectSelect(){
  const pid=document.getElementById('projectSelect').value;
  if(!pid)return;
  const r=await gql(`query{viewer{project(projectId:"${pid}"){currentEditingContext{id}}}}`);
  const ec=r?.data?.viewer?.project?.currentEditingContext;
  if(ec){
    state.editingContextId=ec.id;
    state.createdElements=[];  // reset tracked elements when switching projects
    // Get explorer description
    const r2=await gql(`query{viewer{editingContext(editingContextId:"${ec.id}"){explorerDescriptions{id label}}}}`);
    const eds=r2?.data?.viewer?.editingContext?.explorerDescriptions||[];
    state.explorerDescId=eds[0]?.id;
    updateRootMutation();
    await loadTree();
  }
}

async function createDocument(){
  if(!state.editingContextId)return showResponse({error:'Select project first'});
  const id=uuid();
  const r=await gql(`mutation{createDocument(input:{id:"${id}",editingContextId:"${state.editingContextId}",name:"Doc_${Date.now().toString(36)}",stereotypeId:"empty_sysmlv2"}){__typename ...on CreateDocumentSuccessPayload{document{id name kind}} ...on ErrorPayload{message}}}`);
  showResponse(r);
  if(r?.data?.createDocument?.document){state.docs.push(r.data.createDocument.document);updateDocSelect();await loadTree()}
}

function updateDocSelect(){const sel=document.getElementById('docSelect');sel.innerHTML='<option value="">-- Select --</option>';state.docs.forEach(d=>{sel.innerHTML+=`<option value="${d.id}">${d.name}</option>`})}
function onDocSelect(){updateRootMutation()}

function updateRootMutation(){
  const typeId=document.getElementById('rootType').value;
  const docId=document.getElementById('docSelect').value||'DOCUMENT_ID';
  const ec=state.editingContextId||'EDITING_CONTEXT_ID';
  const id=uuid();
  document.getElementById('mutationEditor').value=`mutation {
  createRootObject(input: {
    id: "${id}",
    editingContextId: "${ec}",
    documentId: "${docId}",
    domainId: "${state.domain}",
    rootObjectCreationDescriptionId: "${typeId}"
  }) {
    __typename
    ... on ErrorPayload { message }
  }
}`;
}

async function executeRootCreate(){
  const docId=document.getElementById('docSelect').value;
  if(!docId){const r=await createDocument();if(!r)return}
  const typeId=document.getElementById('rootType').value;
  const id=uuid();
  const r=await gql(`mutation{createRootObject(input:{id:"${id}",editingContextId:"${state.editingContextId}",documentId:"${docId||state.docs[state.docs.length-1]?.id}",domainId:"${state.domain}",rootObjectCreationDescriptionId:"${typeId}"}){__typename ...on ErrorPayload{message}}}`);
  showResponse(r);
  if(r?.data?.createRootObject?.__typename!=='ErrorPayload')await loadTree();
}

// === Tree loading ===
// Sirius Web's WebSocket subscription only emits tree data on CHANGE events,
// not on initial subscription. It connects, sends 'ka' (keepalive), then
// 'complete' with no data. So we skip the WS entirely and build the tree
// from REST queries: representations (diagrams) + tracked created elements.
async function loadTree(){
  if(!state.editingContextId)return;
  const tc=document.getElementById('treeContainer');
  tc.innerHTML='<div class="tree-loading">Loading tree...</div>';
  state.treeData=[];
  await fetchDocuments();
}

// Fetch all documents AND model elements in the editing context
async function fetchDocuments(){
  try{
    // Fetch representations (diagrams)
    const r=await gql(`query{viewer{editingContext(editingContextId:"${state.editingContextId}"){representations{edges{node{id label kind}}}}}}`);
    const reps=r?.data?.viewer?.editingContext?.representations?.edges||[];
    const treeItems=[];

    // Add representations as tree nodes
    reps.forEach(e=>{
      const n=e.node;
      treeItems.push({id:n.id,label:n.label,kind:(n.kind||'').replace('siriusComponents://representation?type=',''),hasChildren:false,children:[]});
    });

    // Fetch created elements via REST object() query and build a tree
    if(state.createdElements&&state.createdElements.length>0){
      // Verify each element exists and get its real label
      const verified=[];
      for(const el of state.createdElements){
        try{
          const r2=await gql(`query{viewer{editingContext(editingContextId:"${state.editingContextId}"){object(objectId:"${el.id}"){id kind label}}}}`);
          const obj=r2?.data?.viewer?.editingContext?.object;
          if(obj){
            const kindShort=(obj.kind||'').replace('siriusComponents://semantic?domain=sysml&entity=','');
            verified.push({...el,label:obj.label,kind:kindShort});
          }
        }catch(e2){}
      }

      // Build a tree structure from verified elements
      if(verified.length>0){
        const byId={};
        verified.forEach(el=>{byId[el.id]={...el,children:[],hasChildren:false}});
        const roots=[];
        verified.forEach(el=>{
          if(el.parentId&&byId[el.parentId]){
            byId[el.parentId].children.push(byId[el.id]);
            byId[el.parentId].hasChildren=true;
          }else{
            roots.push(byId[el.id]);
          }
        });
        // Replace treeData with our element tree (merge with representations)
        const combinedTree=[...roots,...treeItems.filter(t=>!roots.some(r=>r.id===t.id))];
        state.treeData=combinedTree;
        renderTree();
        return;
      }
    }

    // Only use fallback if we have no tree data at all from WS
    if(state.treeData.length===0){
      state.treeData=treeItems;
    }
    // Always update the doc list from representations
    renderTree();
  }catch(e){console.error('fetchDocuments error',e)}
}

function renderTree(){
  const tc=document.getElementById('treeContainer');
  const count=countNodes(state.treeData);
  document.getElementById('treeCount').textContent=`${count} nodes`;

  if(state.treeData.length===0){
    tc.innerHTML='<div class="tree-empty">Tree is empty. Create a document and root objects.</div>';
    return;
  }
  tc.innerHTML=renderNodes(state.treeData,0);
  // Attach click handlers
  tc.querySelectorAll('[data-node-id]').forEach(el=>{
    el.onclick=(e)=>{e.stopPropagation();selectTreeNode(el.dataset.nodeId,el.dataset.label,el.dataset.kind)};
  });
}

function countNodes(nodes){
  let n=0;
  for(const node of nodes){n++;if(node.children)n+=countNodes(node.children)}
  return n;
}

function getLabel(node){
  if(typeof node.label==='string')return node.label;
  if(node.label?.styledStringFragments)return node.label.styledStringFragments.map(f=>f.text||'').join('');
  return '(unnamed)';
}

function renderNodes(nodes,depth){
  return nodes.map(node=>{
    const label=getLabel(node);
    const kind=node.kind||'';
    const hasChildren=node.hasChildren||(node.children&&node.children.length>0);
    const children=node.children||[];
    const indent='  '.repeat(depth);
    return `<div class="tree-node" data-node-id="${node.id}" data-label="${label.replace(/"/g,'&quot;')}" data-kind="${kind}">
      <span class="chevron">${hasChildren?'▸':'○'}</span>
      <span class="label">${label||'(unnamed)'}</span>
      ${kind?`<span class="kind">${kind.replace('siriusComponents://','')}</span>`:''}
    </div>
    ${hasChildren&&children.length>0?`<div class="tree-children">${renderNodes(children,depth+1)}</div>`:''}`;
  }).join('');
}

function selectTreeNode(id,label,kind){
  state.selectedElement={id,label,kind};
  document.querySelectorAll('.tree-node').forEach(n=>n.classList.remove('selected'));
  document.querySelector(`[data-node-id="${id}"]`)?.classList.add('selected');
  document.getElementById('elementActions').style.display='flex';
  // Auto-populate createChild mutation with selected element as parent
  setTab('createChild');
  document.getElementById('response').innerHTML=`<div class="response info">Selected: ${label}<br>ID: ${id}<br>Kind: ${kind}<br><br>Mutation auto-populated for createChild (this element as parent).</div>`;
}

async function renameSelected(){
  if(!state.selectedElement)return showResponse({error:'Select an element first'});
  const newName=prompt('Enter new name:',state.selectedElement.label);
  if(!newName)return;
  
  // renameTreeItem requires a live tree subscription (WebSocket) which we don't have.
  // It always times out with "The request has been interrupted due to a timeout".
  // Instead, use insertTextualSysMLv2 to insert a renamed element, then update tracking.
  
  const sel=state.selectedElement;
  const ec=state.editingContextId;
  
  // Determine SysML keyword from element kind
  const kindMap={
    'Package':'package','PartUsage':'part','PartDefinition':'part def',
    'RequirementUsage':'requirement','RequirementDefinition':'requirement def',
    'ConnectionUsage':'connection','ConnectionDefinition':'connection def',
    'FlowConnectionUsage':'flow','FlowConnectionDefinition':'flow def',
    'InterfaceUsage':'interface','InterfaceDefinition':'interface def',
    'PortUsage':'port','PortDefinition':'port def',
    'AttributeUsage':'attribute','AttributeDefinition':'attribute def',
    'ItemUsage':'item','ItemDefinition':'item def',
    'ActionUsage':'action','ActionDefinition':'action def',
    'StateUsage':'state','StateDefinition':'state def',
    'ConstraintUsage':'constraint','ConstraintDefinition':'constraint def',
    'AllocationUsage':'allocation','AllocationDefinition':'allocation def',
    'Comment':'comment','Dependency':'dependency'
  };
  const keyword=kindMap[sel.kind]||'part';
  
  // Find parent element (where we insert the text)
  const parentEl=state.createdElements?.find(e=>e.id===sel.parentId);
  const parentId=parentEl?.id||sel.id;  // fallback to self if no parent tracked
  
  const id=uuid();
  const r=await gql(`mutation{insertTextualSysMLv2(input:{id:"${id}",editingContextId:"${ec}",objectId:"${parentId}",textualContent:"${keyword} ${newName};"}){__typename ...on ErrorPayload{message}}}`);
  
  if(r?.data?.insertTextualSysMLv2?.__typename!=='ErrorPayload'){
    // Success: update tracked element label
    sel.label=newName;
    // Update createdElements tracking
    if(state.createdElements){
      const tracked=state.createdElements.find(e=>e.id===sel.id);
      if(tracked)tracked.label=newName;
    }
    showResponse({info:`Renamed to "${newName}" (via textual insertion). Note: this creates a new element; the old one still exists. Use deleteTreeItem in the main app to remove it.`});
    await loadTree();
  }else{
    showResponse(r);
  }
}

async function deleteSelected(){
  if(!state.selectedElement)return showResponse({error:'Select an element first'});
  if(!confirm(`Delete "${state.selectedElement.label}"?`))return;
  const id=uuid();
  const repId=state.explorerDescId||'';
  const r=await gql(`mutation{deleteTreeItem(input:{id:"${id}",editingContextId:"${state.editingContextId}",representationId:"${repId}",treeItemId:"${state.selectedElement.id}"}){__typename ...on ErrorPayload{message}}}`);
  showResponse(r);
  state.selectedElement=null;
  document.getElementById('elementActions').style.display='none';
  if(r?.data?.deleteTreeItem?.__typename!=='ErrorPayload')await loadTree();
}

// === Connected Parts Example ===
async function createConnectedPartsExample(){
  if(!state.editingContextId)return showResponse({error:'Select a project first'});
  const log=[];
  const addLog=(msg)=>{log.push(msg);showResponse({info:log.join('\n')})};
  addLog('Creating connected parts example...');

  const ec=state.editingContextId;
  const DOMAIN='http://www.eclipse.org/syson/sysml';

  try{
    // 1. Create document
    const docMuttId=uuid();
    addLog('1. Creating document...');
    const docR=await gql(`mutation{createDocument(input:{id:"${docMuttId}",editingContextId:"${ec}",name:"ConnectedParts_Demo",stereotypeId:"empty_sysmlv2"}){__typename ...on CreateDocumentSuccessPayload{document{id}} ...on ErrorPayload{message}}}`);
    if(docR?.data?.createDocument?.__typename==='ErrorPayload')throw new Error('Doc: '+docR.data.createDocument.message);
    const docId=docR.data.createDocument.document.id;
    addLog('   Document created: '+docId);

    // 2. Create Package root
    addLog('2. Creating Package (root)...');
    const pkgMuttId=uuid();
    const pkgR=await gql(`mutation{createRootObject(input:{id:"${pkgMuttId}",editingContextId:"${ec}",documentId:"${docId}",domainId:"${DOMAIN}",rootObjectCreationDescriptionId:"SysMLv2EditService-Package"}){__typename ...on CreateRootObjectSuccessPayload{object{id}} ...on ErrorPayload{message}}}`);
    if(pkgR?.data?.createRootObject?.__typename==='ErrorPayload')throw new Error('Pkg: '+pkgR.data.createRootObject.message);
    const pkgId=pkgR.data.createRootObject.object.id;
    addLog('   Package created: '+pkgId);
    // Track created element for tree display
    state.createdElements=state.createdElements||[];
    state.createdElements.push({id:pkgId,label:'Package',kind:'Package',parentId:null});

    // 3. Create PartUsage "Source"
    addLog('3. Creating PartUsage "source"...');
    const p1MuttId=uuid();
    const p1R=await gql(`mutation{createChild(input:{id:"${p1MuttId}",editingContextId:"${ec}",objectId:"${pkgId}",childCreationDescriptionId:"SysMLv2EditService-PartUsage"}){__typename ...on CreateChildSuccessPayload{object{id}} ...on ErrorPayload{message}}}`);
    if(p1R?.data?.createChild?.__typename==='ErrorPayload')throw new Error('Part1: '+p1R.data.createChild.message);
    const part1Id=p1R.data.createChild.object.id;
    addLog('   PartUsage created: '+part1Id);
    state.createdElements.push({id:part1Id,label:'source',kind:'PartUsage',parentId:pkgId});

    // 4. Create PartUsage "Target"
    addLog('4. Creating PartUsage "target"...');
    const p2MuttId=uuid();
    const p2R=await gql(`mutation{createChild(input:{id:"${p2MuttId}",editingContextId:"${ec}",objectId:"${pkgId}",childCreationDescriptionId:"SysMLv2EditService-PartUsage"}){__typename ...on CreateChildSuccessPayload{object{id}} ...on ErrorPayload{message}}}`);
    if(p2R?.data?.createChild?.__typename==='ErrorPayload')throw new Error('Part2: '+p2R.data.createChild.message);
    const part2Id=p2R.data.createChild.object.id;
    addLog('   PartUsage created: '+part2Id);
    state.createdElements.push({id:part2Id,label:'target',kind:'PartUsage',parentId:pkgId});

    // 5. Create FlowConnectionUsage connecting them
    addLog('5. Creating FlowConnectionUsage...');
    const connMuttId=uuid();
    const connR=await gql(`mutation{createChild(input:{id:"${connMuttId}",editingContextId:"${ec}",objectId:"${pkgId}",childCreationDescriptionId:"SysMLv2EditService-FlowConnectionUsage"}){__typename ...on CreateChildSuccessPayload{object{id}} ...on ErrorPayload{message}}}`);
    if(connR?.data?.createChild?.__typename==='ErrorPayload')throw new Error('Connection: '+connR.data.createChild.message);
    const connId=connR.data.createChild.object.id;
    addLog('   FlowConnectionUsage created: '+connId);
    state.createdElements.push({id:connId,label:'connection',kind:'FlowConnectionUsage',parentId:pkgId});

    addLog('\n✓ Done! Created:\n  Package (root)\n  ├── PartUsage (source)\n  ├── PartUsage (target)\n  └── FlowConnectionUsage (link)');
    addLog('\nRefresh the tree to see the new elements.');

    await loadTree();
  }catch(e){
    addLog('\n✗ ERROR: '+e.message);
  }
}

function populateCreateRootFromSelected(){
  if(!state.selectedElement)return;
  // Use the selected element as document ID target
  const sel=document.getElementById('docSelect');
  // Check if it's already in the list
  let found=false;
  for(const opt of sel.options){if(opt.value===state.selectedElement.id){sel.value=state.selectedElement.id;found=true;break}}
  if(!found){
    sel.innerHTML+=`<option value="${state.selectedElement.id}">${state.selectedElement.label}</option>`;
    sel.value=state.selectedElement.id;
  }
  setTab('createRootObject');
  updateRootMutation();
}

function setTab(tab){
  state.currentTab=tab;
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const tabs=['createRootObject','createChild','createDocument','renameTreeItem','raw'];
    t.classList.toggle('active',tabs[i]===tab);
  });
  const ec=state.editingContextId||'EDITING_CONTEXT_ID';
  const docId=document.getElementById('docSelect').value||'DOCUMENT_ID';
  const sel=state.selectedElement;
  const id=uuid();

  if(tab==='createRootObject'){updateRootMutation()}
  else if(tab==='createChild'){
    const parentId=sel?.id||'SELECT_PARENT_FROM_TREE';
    const typeId=document.getElementById('rootType').value||'SysMLv2EditService-PartUsage';
    document.getElementById('mutationEditor').value=`mutation {
  createChild(input: {
    id: "${id}",
    editingContextId: "${ec}",
    objectId: "${parentId}",
    childCreationDescriptionId: "${typeId}"
  }) {
    __typename
    ... on CreateChildSuccessPayload { object { id } }
    ... on ErrorPayload { message }
  }
}`;
  }
  else if(tab==='createDocument'){
    document.getElementById('mutationEditor').value=`mutation {
  createDocument(input: {
    id: "${id}",
    editingContextId: "${ec}",
    name: "MyDocument",
    stereotypeId: "empty_sysmlv2"
  }) {
    __typename
    ... on CreateDocumentSuccessPayload { document { id name kind } }
    ... on ErrorPayload { message }
  }
}`;
  }else if(tab==='renameTreeItem'){
    const repId=state.explorerDescId||'EXPLORER_REPRESENTATION_ID';
    document.getElementById('mutationEditor').value=`mutation {
  renameTreeItem(input: {
    id: "${id}",
    editingContextId: "${ec}",
    representationId: "${repId}",
    treeItemId: "${sel?.id||'TREE_ITEM_ID'}",
    newLabel: "New Name"
  }) {
    __typename
    ... on ErrorPayload { message }
  }
}`;
  }else if(tab==='raw'){
    document.getElementById('mutationEditor').value=`query {
  viewer {
    projects { edges { node { id name } } }
  }
}`;
  }
}

async function executeMutation(){
  const q=document.getElementById('mutationEditor').value.trim();
  if(!q)return;
  document.getElementById('response').innerHTML='<div class="response" style="background:#f8fafc">Executing...</div>';
  try{const r=await gql(q);showResponse(r);await loadTree()}catch(e){showResponse({error:e.message})}
}
function copyMutation(){navigator.clipboard.writeText(document.getElementById('mutationEditor').value);document.getElementById('response').innerHTML='<div class="response success">Copied</div>'}
document.getElementById('baseUrl').addEventListener('keydown',e=>{if(e.key==='Enter')connect()});
</script>
